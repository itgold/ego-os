<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1163 853" fill="none"><style>.firefly{animation:blink 4s ease-in-out infinite}.firefly:nth-child(2){animation-delay:-1.3s}.firefly:nth-child(3){animation-delay:-2.6s}.moth{transform-origin:215px 115px;animation:orbit 14s linear infinite}@keyframes blink{0%,100%{opacity:0;transform:scale(.4)}45%,65%{opacity:.9;transform:scale(1)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.firefly,.moth{animation:none;opacity:.5}}</style><g fill="none" stroke="#e8d9b5" opacity=".35"><circle cx="215" cy="115" r="46"/><circle cx="215" cy="115" r="70"/><circle cx="215" cy="115" r="96"/></g><g class="moth" fill="#f6e6bd"><path d="M215 111c-18-16-30-12-34 2 14-1 25 4 34 10 9-6 20-11 34-10-4-14-16-18-34-2Z"/><circle cx="215" cy="115" r="3"/></g><g fill="#f6e6bd"><circle class="firefly" cx="430" cy="650" r="5"/><circle class="firefly" cx="560" cy="560" r="4"/><circle class="firefly" cx="700" cy="470" r="5"/><circle class="firefly" cx="510" cy="710" r="3.5"/><circle class="firefly" cx="780" cy="600" r="4"/></g><path d="M430 760C500 690 530 620 560 560S650 500 700 470" stroke="#e8d9b5" stroke-width="1" stroke-dasharray="2 14" opacity=".35"/></svg>

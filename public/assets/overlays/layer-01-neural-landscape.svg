<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1163 853" fill="none">
  <style>
    .signal-pulse {
      stroke-dasharray: 2 98;
      stroke-dashoffset: 100;
      animation: signal-travel 9s linear infinite;
    }
    .signal-pulse:nth-child(2) { animation-delay: -3.2s; animation-duration: 11s; }
    .signal-pulse:nth-child(3) { animation-delay: -6.4s; animation-duration: 13s; }
    .signal-pulse:nth-child(4) { animation-delay: -1.8s; animation-duration: 10s; }
    @keyframes signal-travel {
      0%, 14% { stroke-dashoffset: 100; opacity: 0; }
      18% { opacity: .95; }
      46% { opacity: .78; }
      52%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal-pulse { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="layer-01-silhouette">
      <path d="M962 0c23 33 54 55 72 88 18 32 21 71 49 91 22 16 55 18 69 42 15 26-3 51-24 70-25 23-55 24-86 31-43 10-61 31-83 67-27 45-40 95-58 145-16 45-38 85-73 116-39 35-89 48-130 79-35 27-66 64-109 75-39 10-80-5-118 9-43 15-72 56-113 70-45 15-88-7-126-30-35-21-71-40-93-74-21-33-16-76-38-106-25-34-71-49-91-87-18-34-4-75-12-112-9-44-44-77-35-127 7-45 29-85 66-112 39-28 86-39 133-44 53-6 106-1 158-13 66-15 110-65 174-78 71-14 139 20 208 12 65-8 121-49 181-63 58-14 112-31 151-67Z"/>
    </clipPath>
    <filter id="soft-node" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <g clip-path="url(#layer-01-silhouette)" stroke="#fffdf6" stroke-linecap="round" stroke-linejoin="round">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1163 853" fill="none"><style>.star{animation:twinkle 4s ease-in-out infinite}.star:nth-child(2n){animation-delay:-1.7s}.orbit{transform-origin:628px 230px;animation:spin 20s linear infinite}@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.star,.orbit{animation:none;opacity:.5}}</style><g fill="#f4dfb2"><circle class="star" cx="110" cy="120" r="3"/><circle class="star" cx="260" cy="210" r="2"/><circle class="star" cx="430" cy="95" r="3"/><circle class="star" cx="860" cy="130" r="2.5"/><circle class="star" cx="1010" cy="300" r="3"/><circle class="star" cx="940" cy="470" r="2"/></g><g class="orbit" fill="none" stroke="#d7b46a" opacity=".4"><ellipse cx="628" cy="230" rx="110" ry="34"/><ellipse cx="628" cy="230" rx="180" ry="58"/></g><g class="orbit" fill="#d7b46a"><circle cx="738" cy="230" r="5"/><circle cx="448" cy="230" r="4"/></g></svg>
